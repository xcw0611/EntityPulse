name: Build Windows Desktop Application

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64 App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '17'
            distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build & Package Windows Portable App
        run: gradle :desktop:packagePortableZip --stacktrace

      - name: Upload Windows Portable App (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: EntityPulse-Windows-x64-Portable
          path: desktop/build/distributions/EntityPulse-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
